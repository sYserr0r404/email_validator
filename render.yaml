services:
  - type: web
    name: mailprobe
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROBE_HELO_HOST
        value: mailprobe.render.com
      - key: PROBE_MAIL_FROM
        value: verify@mailprobe.local
