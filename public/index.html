<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailProbe - Email Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #FBFAF5;
            --black: #000;
            --pink: #FF4081;
            --yellow: #FDF3C4;
            --green: #4CAF50;
            --red: #F44336;
            --amber: #FF9800;
            --grey: #9E9E9E;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--black);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .mode-banner {
            padding: 15px 20px;
            border: 3px solid var(--black);
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-banner.full {
            background: var(--green);
            color: white;
        }

        .mode-banner.api {
            background: var(--green);
            color: white;
        }

        .mode-banner.dns-only {
            background: var(--amber);
            color: var(--black);
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 3px solid var(--black);
            background: white;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            background: var(--yellow);
        }

        .button {
            background: var(--pink);
            color: white;
            border: 3px solid var(--black);
            padding: 12px 30px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--black);
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .button:active {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0 var(--black);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            border: 3px solid var(--black);
            margin-bottom: 20px;
            background: white;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
        }

        .results-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg);
            border: 3px solid var(--black);
            border-right: none;
            padding: 12px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .filter-btn:last-child {
            border-right: 3px solid var(--black);
        }

        .filter-btn.active {
            background: var(--black);
            color: white;
        }

        .filter-btn .count {
            margin-left: 8px;
            opacity: 0.7;
        }

        .results-table-container {
            border: 3px solid var(--black);
            background: white;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table thead {
            background: var(--black);
            color: white;
        }

        .results-table th {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 15px;
            text-align: left;
            border-right: 2px solid #333;
        }

        .results-table th:last-child {
            border-right: none;
        }

        .results-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
            font-size: 13px;
        }

        .results-table td:last-child {
            border-right: none;
        }

        .results-table tr:nth-child(even) {
            background: #FAFAFA;
        }

        .results-table tr:hover {
            background: var(--yellow);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border: 2px solid var(--black);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.valid { background: var(--green); color: white; }
        .status-badge.invalid { background: var(--red); color: white; }
        .status-badge.risky { background: var(--amber); color: white; }
        .status-badge.unknown { background: var(--grey); color: white; }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--pink);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 MailProbe</h1>

        <div id="mode-banner" class="mode-banner dns-only">
            <span id="mode-text">Checking verification service...</span>
        </div>

        <div class="input-section">
            <label for="emails-input">Email Addresses (one per line, or comma/semicolon separated)</label>
            <textarea id="emails-input" placeholder="example@domain.com&#10;user@company.org&#10;test@example.com"></textarea>
            <br>
            <button class="button" onclick="checkEmails()">CHECK</button>
            <button class="button" onclick="clearForm()" style="background: var(--bg); color: var(--black); border-color: var(--black);">CLEAR</button>
            <button class="button" id="retry-btn" onclick="retryUnknown()" style="display: none;">RETRY UNKNOWN</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div style="font-weight: 700;">VERIFYING EMAILS...</div>
        </div>

        <div id="results-section" class="results-section">
            <div class="results-header">VALIDATION RESULTS</div>

            <div id="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill">0%</div>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all" onclick="filterResults('all')">ALL</button>
                <button class="filter-btn" data-filter="valid" onclick="filterResults('valid')">VALID</button>
                <button class="filter-btn" data-filter="invalid" onclick="filterResults('invalid')">INVALID</button>
                <button class="filter-btn" data-filter="risky" onclick="filterResults('risky')">RISKY</button>
                <button class="filter-btn" data-filter="unknown" onclick="filterResults('unknown')">UNKNOWN</button>
            </div>

            <div>
                <button class="button" onclick="exportCSV()">EXPORT CSV</button>
                <button class="button" onclick="exportJSON()">EXPORT JSON</button>
            </div>

            <div class="results-table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>EMAIL</th>
                            <th>STATUS</th>
                            <th>DETAILS</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentResults = [];
        let currentFilter = 'all';
        let currentJobId = null;
        let pollToken = 0;

        async function loadMode() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const banner = document.getElementById('mode-banner');
                const text = document.getElementById('mode-text');
                text.textContent = data.message;
                const modeClass = data.mode === 'api' ? 'api' : data.mode === 'full' ? 'full' : 'dns-only';
                banner.className = 'mode-banner ' + modeClass;
            } catch (error) {
                console.error('Failed to load mode:', error);
            }
        }

        async function checkEmails() {
            const input = document.getElementById('emails-input').value.trim();
            if (!input) {
                alert('Please enter at least one email address');
                return;
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('results-section').classList.remove('active');

            try {
                const res = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emails: input })
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || 'Server error');
                }

                const { jobId } = await res.json();
                currentJobId = jobId;
                pollJob(jobId);
            } catch (error) {
                alert('Error: ' + error.message);
                document.getElementById('loading').classList.remove('active');
            }
        }

        function pollJob(jobId) {
            const token = ++pollToken;
            const poll = async () => {
                if (token !== pollToken || jobId !== currentJobId) return;
                try {
                    const res = await fetch(`/api/jobs/${jobId}`);
                    if (res.status === 429) {
                        console.warn('Polling rate limited; will retry on the next interval.');
                        setTimeout(poll, 3000);
                        return;
                    }
                    if (res.status === 404) {
                        console.error('Job not found. The server may have restarted.');
                        document.getElementById('loading').classList.remove('active');
                        alert('This verification job expired because the server restarted. Please run the check again.');
                        return;
                    }
                    if (!res.ok) throw new Error(`Job request failed (${res.status})`);

                    const job = await res.json();
                    currentResults = job.results;
                    displayResults();

                    const percent = job.progress.total > 0 
                        ? Math.round((job.progress.completed / job.progress.total) * 100)
                        : 0;
                    document.getElementById('progress-fill').textContent = percent + '%';
                    document.getElementById('progress-fill').style.width = percent + '%';

                    if (job.status === 'done') {
                        document.getElementById('loading').classList.remove('active');
                        document.getElementById('retry-btn').style.display = 'inline-block';
                        return;
                    }
                } catch (error) {
                    console.error('Poll error:', error);
                    const loadingText = document.querySelector('#loading div:last-child');
                    loadingText.textContent = 'Waiting for the local server...';
                }
                // Poll immediately, then wait between requests. This avoids the
                // initial 10-second blank pause and prevents overlapping polls.
                setTimeout(poll, 2000);
            };
            poll();
        }

        function displayResults() {
            const tbody = document.getElementById('results-tbody');
            tbody.innerHTML = '';

            currentResults.forEach(result => {
                const row = document.createElement('tr');
                const status = (result.status || 'UNKNOWN').toLowerCase();
                row.dataset.status = status;
                
                let statusBadge = result.status;
                if (result.status === 'QUEUED' || result.status === 'CHECKING') {
                    statusBadge = `<span style="opacity: 0.5;">...${result.status}</span>`;
                } else {
                    statusBadge = `<span class="status-badge ${status}">${result.status}</span>`;
                }

                row.innerHTML = `
                    <td style="font-weight: 700;">${escapeHtml(result.email)}</td>
                    <td>${statusBadge}</td>
                    <td>${escapeHtml(result.reason || '')}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('results-section').classList.add('active');
            document.getElementById('progress-container').style.display = 'block';
            filterResults(currentFilter);
        }

        function filterResults(filter) {
            currentFilter = filter;
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.classList.remove('active');
            });
            const activeButton = Array.from(filterButtons).find(btn => btn.dataset.filter === filter);
            if (activeButton) activeButton.classList.add('active');

            const rows = document.querySelectorAll('#results-tbody tr');
            rows.forEach(row => {
                if (filter === 'all' || row.dataset.status === filter) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        async function retryUnknown() {
            if (!currentJobId) return;
            const res = await fetch(`/api/jobs/${currentJobId}/retry-unknown`, { method: 'POST' });
            const data = await res.json();
            if (data.count > 0) {
                document.getElementById('loading').classList.add('active');
                pollJob(currentJobId);
            }
        }

        function exportCSV() {
            const csv = ['Email,Status,Reason'];
            currentResults.forEach(r => {
                csv.push(`"${r.email}","${r.status}","${(r.reason || '').replace(/"/g, '""')}"`);
            });
            downloadFile('mailprobe-results.csv', csv.join('\n'), 'text/csv');
        }

        function exportJSON() {
            downloadFile('mailprobe-results.json', JSON.stringify(currentResults, null, 2), 'application/json');
        }

        function downloadFile(filename, content, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearForm() {
            document.getElementById('emails-input').value = '';
            document.getElementById('results-section').classList.remove('active');
            document.getElementById('loading').classList.remove('active');
            document.getElementById('retry-btn').style.display = 'none';
            currentResults = [];
            currentJobId = null;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadMode();
    </script>
</body>
</html>
